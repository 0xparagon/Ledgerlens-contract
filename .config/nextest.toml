# cargo-nextest configuration (issue #1223).
# See docs/testing.md for how to run subsets locally.

[store]
dir = "target/nextest"

# ── local (default) ──────────────────────────────────────────────────────────
[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 4 }
status-level = "fail"
final-status-level = "slow"

# Only tests explicitly marked as network-dependent (name contains
# `network_`) may be retried. Everything else must pass on the first attempt.
[[profile.default.overrides]]
filter = "test(/(^|::)network_/)"
retries = { backoff = "exponential", count = 2, delay = "1s", max-delay = "10s" }

# ── CI (pull requests / main) ────────────────────────────────────────────────
[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
status-level = "fail"
final-status-level = "flaky"
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[[profile.ci.overrides]]
filter = "test(/(^|::)network_/)"
retries = { backoff = "exponential", count = 2, delay = "1s", max-delay = "10s" }

# ── nightly (scheduled full run, stricter timeouts, full output) ─────────────
[profile.nightly]
retries = 0
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 10 }
status-level = "slow"
final-status-level = "all"

[profile.nightly.junit]
path = "junit.xml"
store-success-output = true
store-failure-output = true

[[profile.nightly.overrides]]
filter = "test(/(^|::)network_/)"
retries = { backoff = "exponential", count = 3, delay = "2s", max-delay = "30s" }
