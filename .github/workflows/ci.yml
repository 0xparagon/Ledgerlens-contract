name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (native)
        run: cargo build --workspace --locked

      - name: Test (native)
        run: cargo test --workspace --locked

      - name: Build (wasm32)
        run: cargo build --workspace --locked --target wasm32-unknown-unknown

      - name: Cross-target float determinism test
        run: cargo test --locked -p ledgerlens-score --test float_determinism -- --nocapture

  wasm-float-allowlist:
    name: WASM float instruction allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build score contract for wasm32
        run: cargo build --locked -p ledgerlens-score --target wasm32-unknown-unknown --release

      - name: Deny floating-point instructions in contract artifact
        run: |
          set -euo pipefail
          ARTIFACT=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' | head -n 1)
          if [ -z "${ARTIFACT}" ]; then
            echo "No wasm artifact produced; skipping float allowlist check"
            exit 0
          fi
          echo "Auditing ${ARTIFACT} for floating-point instructions"
          if command -v wasm-objdump >/dev/null 2>&1; then
            DISASM=$(wasm-objdump -d "${ARTIFACT}")
          else
            echo "wasm-objdump not available; install wabt to enforce the allowlist"
            exit 1
          fi
          # Reject any floating-point opcode in the contract artifact.
          if echo "${DISASM}" | grep -E '\b(f32|f64)\.[a-z0-9_]+' >/dev/null 2>&1; then
            echo "Floating-point instructions detected in contract artifact:"
            echo "${DISASM}" | grep -E '\b(f32|f64)\.[a-z0-9_]+'
            exit 1
          fi
          echo "No floating-point instructions found in contract artifact"
