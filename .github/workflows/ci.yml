name: Contract CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  deploy-script:
    name: Deployment script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deploy.sh manifest and drift tests
        run: bash tests/deploy/test_deploy.sh

  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  contract-build-lints:
    name: Contract-only dead-code check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: tools/check_contract_build_lints.sh

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  production-acceptance:
    name: Production acceptance report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Run production acceptance suite
        run: scripts/production-acceptance.sh --output target/production-readiness-report.md
      - name: Upload production readiness report
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-report
          path: target/production-readiness-report.md
          retention-days: 14

  error-discriminants:
    name: Error discriminant stability
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the checker itself
        run: tests/check_error_discriminants.test.sh
      - name: Check Error enum discriminants are append-only
        run: tools/check_error_discriminants.sh "${{ github.event.pull_request.base.sha }}" HEAD

  refinement-mapping:
    name: Refinement mapping consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Issue #928: spec/refinement-mapping.md must only reference Rust symbols
      # that actually exist in the contract sources. The mapping drifted once
      # (it documented a nonexistent `finalize_consensus`); this job makes that
      # class of drift fail CI loudly. Always-on: cheap (<1s) and catches drift
      # introduced from either side (doc change or code rename).
      - name: Verify mapping references only real symbols (and test the checker)
        run: bash tests/check_refinement_mapping.sh

  build:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown --release -p ledgerlens-score --locked
      - name: Record WASM byte-size evidence
        run: |
          mkdir -p target
          {
            echo "# WASM Size Evidence"
            echo ""
            echo "Path: target/wasm32-unknown-unknown/release/ledgerlens_score.wasm"
            echo "Bytes: $(wc -c < target/wasm32-unknown-unknown/release/ledgerlens_score.wasm | tr -d ' ')"
            echo "SHA-256: $(sha256sum target/wasm32-unknown-unknown/release/ledgerlens_score.wasm | awk '{print $1}')"
          } > target/wasm-size-report.md
      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-score-wasm
          path: target/wasm32-unknown-unknown/release/ledgerlens_score.wasm
          retention-days: 7
      - name: Upload WASM size report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-score-wasm-size-report
          path: target/wasm-size-report.md
          retention-days: 7
      - name: Enforce WASM size budget
        run: ./scripts/check-wasm-size.sh

  # ── Contract metadata & build provenance (issue #1167) ──────────────────────
  #
  # The release WASM must carry deterministic build/interface metadata custom
  # sections (source repository, commit, crate version, toolchain versions and
  # interface version) so explorers and auditors can tie a deployed hash back
  # to a source revision. This job:
  #   • builds the contract twice from independent target dirs and asserts the
  #     two artifacts are byte-identical (reproducibility, metadata included);
  #   • enforces presence of every required metadata key in the built WASM;
  #   • runs the verification script against a release manifest and confirms it
  #     fails on a tampered artifact.
  # Metadata generation is deterministic: no timestamps, no host paths.
  contract-metadata:
    name: Contract metadata & provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build release WASM (build A)
        run: |
          CARGO_TARGET_DIR=target/repro-a \
            cargo build --target wasm32-unknown-unknown --release -p ledgerlens-score --locked
      - name: Build release WASM (build B)
        run: |
          CARGO_TARGET_DIR=target/repro-b \
            cargo build --target wasm32-unknown-unknown --release -p ledgerlens-score --locked
      - name: Assert byte-identical reproducible builds
        run: |
          A=target/repro-a/wasm32-unknown-unknown/release/ledgerlens_score.wasm
          B=target/repro-b/wasm32-unknown-unknown/release/ledgerlens_score.wasm
          sha256sum "$A" "$B"
          cmp "$A" "$B"
      - name: Enforce required metadata keys
        run: |
          WASM=target/repro-a/wasm32-unknown-unknown/release/ledgerlens_score.wasm
          scripts/verify-deployment.sh --check-metadata "$WASM"
      - name: Verify release manifest and tamper detection
        run: |
          WASM=target/repro-a/wasm32-unknown-unknown/release/ledgerlens_score.wasm
          scripts/verify-deployment.sh --emit-manifest target/release-manifest.json "$WASM"
          scripts/verify-deployment.sh --manifest target/release-manifest.json "$WASM"
          cp "$WASM" target/tampered.wasm
          printf '\x00' | dd of=target/tampered.wasm bs=1 seek=8 count=1 conv=notrunc
          if scripts/verify-deployment.sh --manifest target/release-manifest.json target/tampered.wasm; then
            echo "::error::verification script accepted a tampered artifact"
            exit 1
          fi
      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-score-release-manifest
          path: target/release-manifest.json
          retention-days: 7

  deploy-script-tests:
    name: Deploy script failure-mode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/deploy_script_rpc_failures.sh

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # cargo-audit 0.22 requires Rust 1.88+ and understands the CVSS 4.0
          # records now present in the live RustSec advisory database. This job
          # only inspects Cargo.lock; contract builds remain pinned to Rust 1.81.
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
      - name: Run security audit
        # RUSTSEC-2026-0009 affects time's RFC parsing. time is only pulled in
        # through serde_with -> stellar-xdr; the contract does not invoke that
        # parsing path. The fixed time release requires Edition 2024 and cannot
        # be parsed by the Rust 1.81 toolchain required for deployable Soroban
        # WASM. Keep this exception narrow and remove it when Soroban permits a
        # newer release toolchain.
        run: cargo +1.88.0 audit --ignore RUSTSEC-2026-0009

  # ── Dependency license / policy gate ────────────────────────────────────────
  #
  # Enforces the cargo-deny policy codified in deny.toml:
  #   • licenses — only the explicitly allow-listed permissive licenses may
  #     appear anywhere in the locked dependency graph (no copyleft).
  #   • bans     — no wildcard path dependencies; multiple versions warn.
  #   • advisories — no yanked or unmaintained crates (documented exceptions
  #     for toolchain-pinned crates live in deny.toml's `[advisories].ignore`).
  #   • sources  — only crates.io / pinned git registries.
  #
  # A PR that introduces a disallowed license, a yanked crate, or an
  # unmaintained crate not covered by a documented exception fails here.
  #
  # The 1.88.0 toolchain is used only to install the latest cargo-deny (same
  # pattern as the `audit` job); contract builds remain pinned to Rust 1.81.
  # ─────────────────────────────────────────────────────────────────────────────

  dependency-license:
    name: Dependency license & policy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo +1.88.0 install cargo-deny --version 0.20.2 --locked
      - name: Run cargo-deny checks (licenses, bans, advisories, sources)
        run: cargo-deny check

  # ── Supply-chain integrity checks ───────────────────────────────────────────
  #
  # Verifies that:
  #   1. Every crate in Cargo.lock originates from a pinned, expected registry
  #      (crates.io or git with an exact rev) — no path-only or unpinned
  #      sources that could silently change between runs.
  #   2. The release WASM artifact is signed with a detached SHA-256 manifest
  #      so downstream consumers can verify provenance.
