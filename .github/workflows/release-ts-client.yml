name: Release TypeScript client

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (e.g. @org/ts-client)'
        required: true
        type: string
      version:
        description: 'Version to publish (must match package.json)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish TypeScript client with provenance
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: packages/ts-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/ts-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify generated bindings against schema artifacts
        run: npm run verify:bindings

      - name: Run SDK conformance fixtures
        run: npm run test:conformance

      - name: Run end-to-end test against local network
        run: npm run test:e2e

      - name: Build package
        run: npm run build

      - name: Publish to npm with provenance attestation
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published provenance
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          npm view "$PKG@$VER" dist.attestations --json

  publish-python:
    name: Publish Python client with trusted publishing
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/py-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine mypy

      - name: Verify generated models against schema artifacts
        run: python -m scripts.verify_bindings

      - name: Run SDK conformance fixtures
        run: python -m pytest tests/conformance

      - name: Type check under strict mypy
        run: mypy --strict src

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify py.typed marker is packaged
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile, sys
          ok = False
          for whl in glob.glob('dist/*.whl'):
              with zipfile.ZipFile(whl) as z:
                  if any(n.endswith('py.typed') for n in z.namelist()):
                      ok = True
          for sdist in glob.glob('dist/*.tar.gz'):
              with tarfile.open(sdist) as t:
                  if any(n.endswith('py.typed') for n in t.getnames()):
                      ok = True
          if not ok:
              sys.exit('py.typed marker missing from distribution')
          PY

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/py-client/dist
          attestations: true
