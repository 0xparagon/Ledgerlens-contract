name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (e.g. @org/ts-client)'
        required: true
        type: string
      version:
        description: 'Version to publish (must match package.json)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish TypeScript client with provenance
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: packages/ts-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/ts-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify generated bindings against schema artifacts
        run: npm run verify:bindings

      - name: Run SDK conformance fixtures
        run: npm run test:conformance

      - name: Run end-to-end test against local network
        run: npm run test:e2e

      - name: Build package
        run: npm run build

      - name: Publish to npm with provenance attestation
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published provenance
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          npm view "$PKG@$VER" dist.attestations --json
