[workspace]
resolver = "2"
members = [
    "contracts/ledgerlens-score",
    "contracts/mock-amm",
    "contracts/mock-lending",
    "crates/ledgerlens-consumer",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ledgerlens/ledgerlens"

[workspace.dependencies]
soroban-sdk = "21.0.0"
ledgerlens-consumer = { path = "crates/ledgerlens-consumer", version = "0.1.0" }
