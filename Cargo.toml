[workspace]
resolver = "2"
members = [
    "contracts/ledgerlens-math",
    "contracts/ledgerlens-score",
    "contracts/ledgerlens-aggregator",
    "contracts/ledgerlens-test-support",
    "contracts/reference-provider",
    "contracts/mock-amm",
    "contracts/mock-lending",
    "tools/replay",
    "tools/recovery",
    "tools/schema-gen",
    "tools/invocation-fuzzer",
    "tools/reference-model/driver",
    "tools/score-submitter",
    "tests/composability",
    "tests/conformance",
]

[workspace.dependencies]
zeroize = { version = "1", features = ["zeroize_derive"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
strip = "symbols"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
