# Per-module coverage thresholds enforced by tools/ci/coverage_gate.py (#1225).
# See docs/coverage.md for how to read reports and raise coverage.
#
# Paths are matched as prefixes against repository-relative source paths;
# the longest matching prefix wins. Percentages are line coverage; `branch`
# is enforced only when the report contains branch data (nightly job).

# Files never counted: test modules, generated code, benches and fuzz targets.
exclude = [
  "contracts/ledgerlens-score/src/test",   # test_*.rs and test.rs
  "contracts/ledgerlens-score/src/upgrade_smoke.rs",
  "contracts/ledgerlens-test-support/",
  "contracts/mock-amm/",
  "contracts/mock-lending/",
  "tests/",
  "fuzz/",
  "benches/",
  "/tests/",
  "/test_snapshots/",
  "/generated/",
]

# Maximum allowed drop (percentage points) for any changed file versus the
# baseline report from `main` ("no decrease" rule, with float tolerance).
max_changed_file_drop = 0.0

[default]
line = 50.0

